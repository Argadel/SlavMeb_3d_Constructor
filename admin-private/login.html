<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — Славная мебель</title><link rel="stylesheet" href="/src/admin.css"><body class="login"><main class="login-card"><div class="brandline"><img src="/assets/brand/logo-white.png" alt=""><div><b>СЛАВНАЯ МЕБЕЛЬ</b><small>Управление конструктором</small></div></div><h1>Вход в админку</h1><form id="login"><label>Логин<input name="login" value="admin" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button>Войти</button><p id="msg" role="alert"></p></form><small>Доступ только авторизованным сотрудникам.</small></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok)throw Error(d.error);location.reload()}catch(e){document.querySelector('#msg').textContent=e.message}}</script></body></html>
